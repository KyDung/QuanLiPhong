<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nước rửa bát - Quản lý nhà chung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="nav-brand">
          <h2>🏠 Quản lý nhà chung</h2>
        </div>
        <ul class="nav-menu">
          <li><a href="index.html">🏠 Trang chủ</a></li>
          <li><a href="water.html">💧 Đổi nước</a></li>
          <li><a href="toothpaste.html">🦷 Kem đánh răng</a></li>
          <li><a href="dishwash.html" class="active">🧽 Nước rửa bát</a></li>
          <li><a href="debt.html">💰 Tính nợ</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <div class="page-header">
        <h1>🧽 Quản lý nước rửa bát</h1>
      </div>

      <div class="rotation-card">
        <div class="item-image">
          <img src="./img/NuocRB.jpg" alt="Nước rửa bát" class="item-img" />
        </div>

        <div class="rotation-info">
          <div class="info-item">
            <label>Người mua trước:</label>
            <span id="previousPerson">Đang tải...</span>
          </div>

          <div class="info-item current">
            <label>Người đang mua:</label>
            <span id="currentPerson">Đang tải...</span>
          </div>

          <div class="info-item">
            <label>Người sẽ mua kế tiếp:</label>
            <span id="nextPerson">Đang tải...</span>
          </div>
        </div>

        <div class="action-section">
          <button id="completeBtn" class="btn btn-success">✅ Đã mua</button>
        </div>
      </div>

      <div class="history-section">
        <h3>Lịch sử mua nước rửa bát</h3>
        <div id="historyList" class="history-list">
          <p>Đang tải lịch sử...</p>
        </div>
      </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="common.js"></script>
    <script src="rotation.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        new RotationManager({
          path: "dishwashRotation",
          doneVerb: "mua nước rửa bát",
          confirmText: "Xác nhận đã mua nước rửa bát?",
          emptyHistory: "Chưa có lịch sử mua nước rửa bát",
        });
      });
    </script>
  </body>
</html>
